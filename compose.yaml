name: documentllm

services:
  documentllm:
    image: ${DOCUMENTLLM_IMAGE:-documentllm:local}
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - documentllm-data:/data
    ports:
      - "${DOCUMENTLLM_HOST:-127.0.0.1}:3001:3001"

volumes:
  documentllm-data:
