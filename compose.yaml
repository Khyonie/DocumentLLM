name: documentllm

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  documentllm:
    build:
      context: .
    restart: unless-stopped
    environment:
      DOCUMENTLLM_OLLAMA_URL: http://ollama:11434
    volumes:
      - ./index:/data
      - ./upload:/app/upload
      - fastembed-cache:/cache/fastembed
    ports:
      - "${DOCUMENTLLM_HOST:-0.0.0.0}:3001:3001"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  fastembed-cache:
