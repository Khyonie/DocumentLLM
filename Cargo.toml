[package]
name = "llm-project"
version = "0.1.0"
edition = "2024"

[dependencies]
pdf-inspector = { git = "https://github.com/firecrawl/pdf-inspector" }
fastembed = "5"
anyhow = "1"
arrow-array = "58"
arrow-schema = "58"
futures-util = "0.3"
lancedb = "0.31"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
markdown-chunk = "0.1.0"
serde = { version = "1", features = ["derive"] }
csv = "1.4.0"
reqwest = { version = "0.12", features = ["json"] }
html-to-markdown-rs = "3.10.5"
